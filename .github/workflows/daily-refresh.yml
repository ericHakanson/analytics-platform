name: daily-refresh

on:
  schedule:
    # Target: midnight America/New_York. EST = 05:23 UTC, EDT = 04:23 UTC.
    # Off-peak minute (GitHub delays top-of-the-hour crons the most). Both fire;
    # the guard lets the FIRST one that actually executes deploy and dedupes the
    # second — delay-tolerant, unlike an exact-hour check (2026-06-10 incident:
    # both crons started 4h late and an hour-equality guard skipped the deploy).
    - cron: '23 4 * * *'
    - cron: '23 5 * * *'
  workflow_dispatch: {}   # manual on-demand refresh (bypasses the guard)

concurrency:
  group: daily-refresh
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write   # required for Workload Identity Federation
  actions: read     # guard queries this workflow's own run history

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Manual run — proceeding."; echo "proceed=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Dedup: skip only if another scheduled run already DEPLOYED (refresh
          # job succeeded) in the last 6 hours. A guard-skipped run concludes
          # "success" too, so we must check the refresh job, not the run.
          # 6h (not longer): wide enough to dedup the same-night cron pair even
          # hours late, narrow enough that a late deploy one night can never
          # suppress the next night's run. Erring toward a harmless serialized
          # double-deploy beats silently missing a day.
          CUTOFF=$(date -u -d '-6 hours' +%Y-%m-%dT%H:%M:%SZ)
          DEPLOYED=false
          for RID in $(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/daily-refresh.yml/runs?event=schedule&created=>=${CUTOFF}&per_page=10" --jq '.workflow_runs[].id'); do
            [ "$RID" = "${GITHUB_RUN_ID}" ] && continue
            CONCLUSION=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RID}/jobs" --jq '.jobs[] | select(.name=="refresh") | .conclusion')
            if [ "$CONCLUSION" = "success" ]; then
              DEPLOYED=true
              echo "Scheduled run ${RID} already deployed within the last 6h — skipping."
              break
            fi
          done
          if [ "$DEPLOYED" = "true" ]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "No scheduled deploy in the last 6h — proceeding."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

  refresh:
    needs: guard
    if: needs.guard.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUBLISHING_DATA_MODE: sample
      VITE_PUBLISHING_ENV: production
      EVIDENCE_VAR__contract_root: ./data/contracts/csv
      VITE_PUBLIC_SITE_BASE_URL: https://signals.fortisland.me
      VITE_HUBSPOT_FORM_BASE_URL: ${{ vars.VITE_HUBSPOT_FORM_BASE_URL }}
      VITE_HUBSPOT_CAMPAIGN_UTM_SOURCE: fortisland-signals
      # FOR-591 fail-fast: bound EVERY source query with a server-side
      # statement_timeout so a runaway/hung query (or a slow lock wait) fails in
      # ~15s instead of hanging `evidence sources` to the job's 20-min
      # timeout-minutes (which concludes `cancelled`, not `failed`, silently
      # skipping the alert step below). Supplied via Evidence's per-source env
      # override (`EVIDENCE_SOURCE__<name>__<option>`), which is layered OVER the
      # connection files at load time — so the secret-written
      # `connection.options.yaml` is NEVER parsed/rewritten and its exact bytes
      # (and quoting) are preserved. The pg `options` field is passed straight to
      # libpq as extra `-c key=value` flags. (Earlier mechanism — rewriting the
      # base64-encoded options file with a plaintext `options:` value — made
      # Evidence's loader reject the file at "Loading plugins & sources" and broke
      # every run; the env override avoids touching the file entirely.)
      EVIDENCE_SOURCE__google_cloud_postgresql__options: '-c statement_timeout=15000'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Write .env for validate:env + Vite
        run: |
          cat > .env <<EOF
          PUBLISHING_DATA_MODE=${PUBLISHING_DATA_MODE}
          VITE_PUBLISHING_ENV=${VITE_PUBLISHING_ENV}
          EVIDENCE_VAR__contract_root=${EVIDENCE_VAR__contract_root}
          VITE_PUBLIC_SITE_BASE_URL=${VITE_PUBLIC_SITE_BASE_URL}
          VITE_HUBSPOT_FORM_BASE_URL=${VITE_HUBSPOT_FORM_BASE_URL}
          VITE_HUBSPOT_CAMPAIGN_UTM_SOURCE=${VITE_HUBSPOT_CAMPAIGN_UTM_SOURCE}
          EOF

      - name: Write Cloud SQL connection options (proxy)
        env:
          EVIDENCE_CONNECTION_OPTIONS_YAML: ${{ secrets.EVIDENCE_CONNECTION_OPTIONS_YAML }}
        run: |
          CONN_FILE=sources/google_cloud_postgresql/connection.options.yaml
          # Write the secret VERBATIM — every value in this file is base64-encoded
          # (Evidence's loader base64-decodes each value via decodeBase64Deep), so
          # the file must NOT be parsed, merged, or re-serialized here. The
          # statement_timeout bound is supplied separately via the
          # EVIDENCE_SOURCE__google_cloud_postgresql__options job env var above,
          # which Evidence layers over this file at load time without touching it.
          printf '%s' "$EVIDENCE_CONNECTION_OPTIONS_YAML" > "$CONN_FILE"

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Start Cloud SQL Auth Proxy
        run: |
          curl -sSf -o cloud-sql-proxy \
            https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.14.1/cloud-sql-proxy.linux.amd64
          chmod +x cloud-sql-proxy
          ./cloud-sql-proxy --port 5432 --quota-project recently-sold-real-estate \
            "${{ vars.CLOUDSQL_INSTANCE_CONNECTION_NAME }}" &
          echo "Waiting for proxy on 127.0.0.1:5432..."
          for i in $(seq 1 30); do
            (exec 3<>/dev/tcp/127.0.0.1/5432) >/dev/null 2>&1 && { echo "proxy up"; break; }
            sleep 1
          done

      - name: Generate Evidence sources (queries Cloud SQL via proxy)
        # FOR-591 fail-fast: `--strict` makes `evidence sources` exit non-zero
        # on any source-query error instead of swallowing it and continuing
        # with a stale/empty manifest (the FOR-589 `permission denied for table
        # properties` signature, which previously hung to the job timeout).
        # Combined with statement_timeout above, a broken source now fails this
        # step in seconds, so the run concludes `failure` and alerts.
        run: npm run sources:strict

      - name: Re-apply dark/light favicon patch to app.html
        run: |
          # The build template lives in node_modules on a fresh checkout;
          # .evidence/template only exists on dev machines (kept as fallback).
          PATCHED=0
          for APP_HTML in \
            node_modules/@evidence-dev/evidence/template/src/app.html \
            .evidence/template/src/app.html
          do
            if [ -f "$APP_HTML" ]; then
              perl -0pi -e 's{<link rel="icon" href="%sveltekit\.assets%/favicon\.ico" sizes="32x32" />\s*\n\s*<link rel="icon" href="%sveltekit\.assets%/icon\.svg" type="image/svg\+xml" />}{<link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="32x32" media="(prefers-color-scheme: light)" />\n    <link rel="icon" href="%sveltekit.assets%/favicon-dark.ico" sizes="32x32" media="(prefers-color-scheme: dark)" />}g' "$APP_HTML"
              echo "Patched $APP_HTML"
              PATCHED=1
            fi
          done
          if [ "$PATCHED" = "0" ]; then
            echo "WARNING: no app.html found — favicon patch skipped"
          fi

      - name: Evidence production build
        run: NODE_ENV=production npx evidence build

      - name: Deploy to Firebase Hosting
        run: npx firebase-tools@13 deploy --only hosting --project fort-island-signals --non-interactive

      # ---------- failure alerting ----------
      - name: Create Linear issue on failure
        # FOR-591: alert on `cancelled()` too, not just `failure()`. A
        # `timeout-minutes` kill concludes the job as `cancelled` (NOT
        # `failed`), so a `failure()`-only gate silently skipped the alert when
        # a source query hung (FOR-589: the dashboard stopped updating for ~2
        # days with zero alerts). The fail-fast changes above make a hang exit
        # as `failure` in seconds; this `cancelled()` clause is the belt-and-
        # suspenders so even a genuine job-level cancel still notifies.
        if: cancelled() || failure()
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          RUN_RESULT: ${{ job.status }}
        run: |
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          # job.status is "cancelled" for a timeout-kill, "failure" otherwise.
          RESULT="${RUN_RESULT:-failure}"
          RESPONSE=$(curl -sS https://api.linear.app/graphql \
            -H "Content-Type: application/json" \
            -H "Authorization: ${LINEAR_API_KEY}" \
            -d "$(jq -n --arg url "$RUN_URL" --arg run "$GITHUB_RUN_NUMBER" --arg result "$RESULT" '{
              query: "mutation($input: IssueCreateInput!){ issueCreate(input:$input){ success issue{ identifier url } } }",
              variables: { input: {
                teamId: "72d8f11b-f69e-4cac-b892-ba45c3e9bae0",
                projectId: "aab45999-e3c7-40f8-8049-ddbf7520f563",
                priority: 2,
                title: ("Daily dashboard refresh " + $result + " (run #" + $run + ")"),
                description: ("The scheduled `daily-refresh` workflow ended `" + $result + "`.\n\nRun: " + $url + "\n\nA `cancelled` result usually means the job hit its `timeout-minutes` (e.g. a hung source query) — check the `Generate Evidence sources` step first, then the Cloud SQL Auth Proxy, build, or Firebase deploy step logs.")
              }}}')")
          if echo "$RESPONSE" | jq -e '.data.issueCreate.success == true' >/dev/null; then
            echo "Linear issue filed: $(echo "$RESPONSE" | jq -r '.data.issueCreate.issue.identifier + " " + .data.issueCreate.issue.url')"
          else
            # Best-effort: a Linear/telemetry failure must not mask the original
            # build failure. GitHub's native "failed workflows" email still
            # delivers to eric@fortisland.me as the durable backstop. Log and
            # move on rather than exit 1 (which would itself read as the cause).
            echo "WARNING: Linear issue creation failed (best-effort alert; native email still fires):"
            echo "$RESPONSE" | jq '.errors // .' || echo "$RESPONSE"
          fi

      # Failure email: GitHub's native notification (Settings → Notifications →
      # Actions → "Failed workflows only") delivers to eric@fortisland.me.
      # Explicit SMTP step removed by decision 2026-06-09 (FOR-543).
