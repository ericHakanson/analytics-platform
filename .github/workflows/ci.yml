name: ci

# FOR-591: a real, required check on PRs to main. Without this, the
# `validate:refresh` guard (scripts/validate-refresh-failfast.mjs) only ran
# locally and could not stop a regression of the daily-refresh fail-fast
# invariants (strict sources, bounded statement_timeout, cancelled()||failure()
# alert gate). This wires it into CI so a regression fails the PR.

on:
  pull_request:
    branches:
      - main
  # Allow manual re-runs / branch validation off the Actions tab.
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validate-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate daily-refresh fail-fast invariants
        run: npm run validate:refresh

      # REAL `evidence sources --strict` regression test for the connection
      # options + statement_timeout mechanism. The static validator above only
      # checks the workflow wiring; this is the guard FOR-591 was MISSING — it
      # actually runs `evidence sources --strict` against a LOCAL placeholder
      # connection (host 127.0.0.1, never the real secret), built the way CI
      # builds it, and asserts the run gets PAST "Loading plugins & sources"
      # (a subsequent connect failure to the fake host is fine). It would have
      # caught the 9-day outage: a plaintext `options:` value in the
      # base64-encoded connection file is rejected by the strict loader.
      - name: Test strict sources connection options
        run: npm run test:strict-options
